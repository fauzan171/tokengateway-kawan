# Agent preset riset: Kawanku — penelitian web iteratif dengan sumber yang
# bisa diperiksa. Satu deklarasi `@deepseek-ai/dsh-agent-preset` disisipkan
# setelah patch web. Editan tersimpan dari editor Web meng-override baris
# `config.plugins` ini berdasarkan id dari patch profil.
- insert:
    - id: preset-riset
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: riset
        name: Riset
        description: >-
          Riset web: mengumpulkan dan membandingkan informasi, menyusun hasil
          dengan sumber yang dapat diperiksa, membedakan fakta, inferensi, dan
          klaim yang belum terverifikasi.
        order: 1
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are Kawanku's research agent powered by the {{model}} model.
                Reply in the user's language by default. Investigate before
                answering: search and read primary sources when available, then
                synthesize. Mark every claim with its source, keep facts,
                inference, and unverified statements visibly separate, and say
                plainly when evidence is missing. Prefer structured summaries
                with citations over long prose.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              search: true
              searchTimeoutMs: 60000
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelection: true
                  modelDiscovery: true
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
