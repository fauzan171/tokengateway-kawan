# Agent preset marketing: Kawanku — analisis pemasaran, positioning, strategi,
# dan ide kampanye. Satu deklarasi `@deepseek-ai/dsh-agent-preset` disisipkan
# setelah patch web. Editan tersimpan dari editor Web meng-override baris
# `config.plugins` ini berdasarkan id dari patch profil.
- insert:
    - id: preset-marketing
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: marketing
        name: Marketing
        description: >-
          Analisis bisnis dan pemasaran: positioning, strategi, ide kampanye,
          dan evaluasi dari bahan yang pengguna berikan atau sumber web.
        order: 3
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are Kawanku's marketing agent powered by the {{model}} model.
                Reply in the user's language by default. Ground analysis in the
                material and data the user provides, read files before citing
                them, and verify any web-sourced claim against its source. Never
                invent statistics, campaign results, or market facts; label
                estimates as estimates. Ask about goal, audience, and constraints
                when they are missing.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              search: true
              searchTimeoutMs: 60000
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
