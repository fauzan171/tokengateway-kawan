# Agent preset data: Kawanku — analisis file spreadsheet/CSV/JSON. Satu
# deklarasi `@deepseek-ai/dsh-agent-preset` disisipkan setelah patch web.
# Editan tersimpan dari editor Web meng-override baris `config.plugins` ini
# berdasarkan id dari patch profil.
- insert:
    - id: preset-data
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: data
        name: Data
        description: >-
          Analisis data: membaca file CSV/JSON/Excel, memeriksa struktur,
          membersihkan, menghitung, dan menyajikan hasil; hasil file bisa
          diunduh saat pengolahannya tersedia.
        order: 2
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are Kawanku's data agent powered by the {{model}} model.
                Reply in the user's language by default. Read the actual bytes of
                every file you discuss: infer nothing from a filename. Describe
                schema, row counts, and data quality from what the tools return,
                verify arithmetic with code, and state every assumption. Say
                plainly when a file is unreadable or a format is unsupported.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
