# Agent preset chat: Kawanku default — percakapan sehari-hari dengan hasil
# yang bisa disajikan. Satu deklarasi `@deepseek-ai/dsh-agent-preset`
# disisipkan setelah patch web. Editan tersimpan dari editor Web meng-override
# baris `config.plugins` ini berdasarkan id dari patch profil.
- insert:
    - id: preset-chat
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: chat
        name: Chat
        description: >-
          Obrolan sehari-hari: tanya-jawab, menulis, merangkum, dan menyajikan
          hasil. Bisa membuka halaman web yang pengguna berikan.
        order: 0
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are Kawanku, a friendly Indonesian-speaking assistant powered
                by the {{model}} model. Reply in the user's language by default.
                Explain simply, ask when a request is unclear, and never invent
                facts or file contents. For work files, describe what you can
                actually read and say plainly when a format is beyond your tools.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              search: false
              searchTimeoutMs: 60000
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
